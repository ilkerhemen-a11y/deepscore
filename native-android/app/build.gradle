plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deepscore.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deepscore.app'
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName '0.5.0'
    }

    buildTypes {
        release {
            // Temporary debug signing makes this diagnostic APK directly installable.
            // Replace with a production signing key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
