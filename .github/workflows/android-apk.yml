name: Build DeepScore Android APK

on:
  push:
    branches: [main, codex/prediction-lab]
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Check TypeScript
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: "1"
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: deepscore-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify release startup on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          working-directory: mobile
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.deepscore.app/.MainActivity
            sleep 15
            adb logcat -d > startup-logcat.txt
            adb exec-out screencap -p > startup.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml startup-window.xml
            adb shell pidof com.deepscore.app
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-startup-diagnostics
          path: |
            mobile/startup-logcat.txt
            mobile/startup.png
            mobile/startup-window.xml
          if-no-files-found: warn
