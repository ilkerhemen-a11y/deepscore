name: DeepScore Native Android Baseline

on:
  push:
    branches:
      - restart/native-android-baseline
    paths:
      - "native-android/**"
      - ".github/workflows/android-native-baseline.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build DeepScore V5 release APK
        working-directory: native-android
        run: gradle --no-daemon assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: deepscore-v5-full-stages-apk
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
